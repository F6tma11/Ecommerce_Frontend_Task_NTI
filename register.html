<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create account | CozyCart</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page"><a class="brand auth-brand" href="index.html">cozy<span>cart.</span></a>
    <main class="auth-card">
        <p class="eyebrow">JOIN THE COMMUNITY</p>
        <h1>Create your account</h1>
        <p class="muted">A few details and you’re all set.</p>
        <form id="register-form" novalidate><label>Full name<input name="name" autocomplete="name" required
                    minlength="2" maxlength="60"></label><small class="field-error"
                data-error="name"></small><label>Email<input type="email" name="email" autocomplete="email"
                    required></label><small class="field-error" data-error="email"></small><label>Password<input
                    type="password" name="password" autocomplete="new-password" required minlength="8"></label><small
                class="field-error" data-error="password"></small><label>Confirm password<input type="password"
                    name="confirmPassword" autocomplete="new-password" required></label><small class="field-error"
                data-error="confirmPassword"></small>
            <p id="form-error" class="form-error"></p><button class="btn btn-dark full" type="submit">Create
                account</button>
        </form>
        <p class="auth-switch">Already registered? <a href="login.html">Login</a></p>
    </main>
    <script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
    <script>Auth.initRegister();</script>
</body>

</html>
